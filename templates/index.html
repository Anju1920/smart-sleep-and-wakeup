<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Activity Alert</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            font-family: Arial, sans-serif;

            background: #111827;
            color: white;

            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .camera-box {
            position: relative;

            width: 100%;
            max-width: 800px;

            margin: 20px auto;

            background: black;

            border-radius: 15px;

            overflow: hidden;
        }

        video {
            width: 100%;
            display: block;

            transform: scaleX(-1);
        }

        canvas {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;
        }

        .status {
            font-size: 28px;
            font-weight: bold;

            margin: 15px;
        }

        .open {
            color: #22c55e;
        }

        .closed {
            color: #ef4444;
        }

        .waiting {
            color: #facc15;
        }

        .info {
            margin: 10px;

            font-size: 18px;
        }

        button {
            padding: 12px 25px;

            font-size: 18px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Activity Alert</h1>

    <button id="startButton">
        Start Camera
    </button>

    <div class="camera-box">

        <video
            id="video"
            autoplay
            muted
            playsinline
        ></video>

        <canvas id="canvas"></canvas>

    </div>

    <div
        id="status"
        class="status waiting"
    >
        Camera not started
    </div>

    <div
        id="timer"
        class="info"
    >
        Closed: 0.0 seconds
    </div>

    <div
        id="ratio"
        class="info"
    >
        Eye Ratio: --
    </div>

</div>


<!-- =====================================================
     AUDIO
===================================================== -->

<audio
    id="voice1"
    src="{{ url_for('static', filename='voice1.mp3') }}"
    preload="auto"
></audio>

<audio
    id="voice2"
    src="{{ url_for('static', filename='voice2.mp3') }}"
    preload="auto"
></audio>


<!-- =====================================================
     MEDIAPIPE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>


<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const statusElement =
    document.getElementById("status");

const timerElement =
    document.getElementById("timer");

const ratioElement =
    document.getElementById("ratio");

const startButton =
    document.getElementById("startButton");


const voice1 =
    document.getElementById("voice1");

const voice2 =
    document.getElementById("voice2");


/* =====================================================
   SETTINGS
===================================================== */

const CLOSED_THRESHOLD = 0.20;

const CLOSED_TIME_LIMIT = 10;


/* =====================================================
   STATE
===================================================== */

let eyesClosedStart = null;

let voice2Playing = false;

let previousState = "UNKNOWN";

let cameraStarted = false;


/* =====================================================
   EYE LANDMARKS
===================================================== */

const LEFT_EYE = [
    362,
    385,
    387,
    263,
    373,
    380
];

const RIGHT_EYE = [
    33,
    160,
    158,
    133,
    153,
    144
];


/* =====================================================
   DISTANCE
===================================================== */

function distance(p1, p2) {

    const dx = p1.x - p2.x;

    const dy = p1.y - p2.y;

    return Math.sqrt(
        dx * dx + dy * dy
    );
}


/* =====================================================
   EYE RATIO
===================================================== */

function eyeRatio(
    landmarks,
    points
) {

    const p1 =
        landmarks[points[0]];

    const p2 =
        landmarks[points[1]];

    const p3 =
        landmarks[points[2]];

    const p4 =
        landmarks[points[3]];

    const p5 =
        landmarks[points[4]];

    const p6 =
        landmarks[points[5]];


    const vertical1 =
        distance(p2, p6);

    const vertical2 =
        distance(p3, p5);

    const horizontal =
        distance(p1, p4);


    if (horizontal === 0) {

        return 0;

    }


    return (
        vertical1 +
        vertical2
    ) / (
        2 *
        horizontal
    );
}


/* =====================================================
   PLAY VOICE 1
===================================================== */

function playVoice1() {

    if (voice2Playing) {

        return;

    }


    try {

        voice2.pause();

        voice2.currentTime = 0;


        voice1.loop = true;

        voice1.play()
            .catch(error => {

                console.log(
                    "Voice 1 needs user interaction:",
                    error
                );

            });


        console.log(
            "Voice 1 playing"
        );

    }

    catch (error) {

        console.error(
            "Voice 1 error:",
            error
        );

    }

}


/* =====================================================
   PLAY VOICE 2
===================================================== */

function playVoice2() {

    if (voice2Playing) {

        return;

    }


    try {

        voice1.pause();

        voice1.currentTime = 0;


        voice2.loop = true;

        voice2Playing = true;


        voice2.play()
            .catch(error => {

                console.log(
                    "Voice 2 error:",
                    error
                );

            });


        console.log(
            "Voice 2 playing"
        );

    }

    catch (error) {

        console.error(
            "Voice 2 error:",
            error
        );

    }

}


/* =====================================================
   STOP VOICE 2
===================================================== */

function stopVoice2() {

    voice2.pause();

    voice2.currentTime = 0;

    voice2Playing = false;


    console.log(
        "Voice 2 stopped"
    );

}


/* =====================================================
   MEDIAPIPE
===================================================== */

const faceMesh =
    new FaceMesh({

        locateFile: (
            file
        ) => {

            return `
            https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}
            `;

        }

    });


faceMesh.setOptions({

    maxNumFaces: 1,

    refineLandmarks: true,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

});


/* =====================================================
   FACE RESULTS
===================================================== */

faceMesh.onResults(
    onResults
);


/* =====================================================
   RESULTS
===================================================== */

function onResults(results) {


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* =================================================
       NO FACE
    ================================================= */

    if (
        !results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0
    ) {

        statusElement.textContent =
            "NO FACE DETECTED";

        statusElement.className =
            "status waiting";


        eyesClosedStart = null;

        previousState = "UNKNOWN";


        if (voice2Playing) {

            stopVoice2();

            playVoice1();

        }


        timerElement.textContent =
            "Closed: 0.0 seconds";


        ratioElement.textContent =
            "Eye Ratio: --";


        return;

    }


    /* =================================================
       LANDMARKS
    ================================================= */

    const landmarks =
        results
        .multiFaceLandmarks[0];


    const left =
        eyeRatio(
            landmarks,
            LEFT_EYE
        );


    const right =
        eyeRatio(
            landmarks,
            RIGHT_EYE
        );


    const average =
        (left + right) / 2;


    ratioElement.textContent =
        `Eye Ratio: ${average.toFixed(3)}`;


    /* =================================================
       EYES CLOSED
    ================================================= */

    if (
        average <
        CLOSED_THRESHOLD
    ) {

        const state = "CLOSED";


        statusElement.textContent =
            "EYES CLOSED";

        statusElement.className =
            "status closed";


        /* =============================================
           START TIMER
        ============================================= */

        if (
            eyesClosedStart === null
        ) {

            eyesClosedStart =
                Date.now();


            console.log(
                "Eyes closed - timer started"
            );


            /*
             Voice 1 continues during
             first 10 seconds
            */

            if (
                !voice2Playing &&
                voice1.paused
            ) {

                playVoice1();

            }

        }


        /* =============================================
           CLOSED TIME
        ============================================= */

        const closedTime =
            (
                Date.now() -
                eyesClosedStart
            ) / 1000;


        timerElement.textContent =
            `Closed: ${closedTime.toFixed(1)} seconds`;


        /* =============================================
           10 SECOND LIMIT
        ============================================= */

        if (
            closedTime >=
            CLOSED_TIME_LIMIT
        ) {

            if (!voice2Playing) {

                console.log(
                    "10 seconds completed"
                );


                /*
                 Voice 1 stops
                 Voice 2 starts
                */

                voice1.pause();

                voice1.currentTime = 0;


                playVoice2();

            }

        }


        previousState =
            state;

        return;

    }


    /* =================================================
       EYES OPEN
    ================================================= */

    const state = "OPEN";


    statusElement.textContent =
        "EYES OPEN";

    statusElement.className =
        "status open";


    timerElement.textContent =
        "Closed: 0.0 seconds";


    eyesClosedStart = null;


    /* =================================================
       VOICE 2 → VOICE 1
    ================================================= */

    if (voice2Playing) {

        console.log(
            "Eyes opened - stopping Voice 2"
        );


        stopVoice2();


        /*
         Start Voice 1 immediately
        */

        playVoice1();

    }


    /* =================================================
       NOTHING PLAYING
    ================================================= */

    else if (
        voice1.paused
    ) {

        playVoice1();

    }


    previousState =
        state;

}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {

    try {

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video: {
                    width: 640,
                    height: 480
                },

                audio: false

            });


        video.srcObject =
            stream;


        await video.play();


        cameraStarted = true;


        startButton.textContent =
            "Camera Running";


        startButton.disabled =
            true;


        /*
         Browser allows audio after
         user clicks Start Camera.
        */

        voice1.loop = true;

        await voice1.play();


        console.log(
            "Camera started"
        );


        /*
         Start MediaPipe processing
        */

        processCamera();


    }

    catch (error) {

        console.error(
            "Camera error:",
            error
        );


        statusElement.textContent =
            "Camera permission denied";


        statusElement.className =
            "status closed";

    }

}


/* =====================================================
   CAMERA PROCESSING
===================================================== */

async function processCamera() {

    if (!cameraStarted) {

        return;

    }


    await faceMesh.send({
        image: video
    });


    requestAnimationFrame(
        processCamera
    );

}


/* =====================================================
   START BUTTON
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);

</script>

</body>
</html>
