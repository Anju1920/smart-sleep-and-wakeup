<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Activity Alert</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #020617,
                    #0f172a,
                    #1e293b
                );

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        .container {

            width: 100%;

            max-width: 900px;

            background: #111827;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.5);
        }


        h1 {

            text-align: center;

            color: #60a5fa;

            margin-top: 0;
        }


        .server {

            text-align: center;

            color: #22c55e;

            margin-bottom: 20px;

            font-weight: bold;
        }


        .camera {

            width: 100%;

            background: #000;

            border-radius: 15px;

            overflow: hidden;

            border: 3px solid #334155;
        }


        .camera img {

            width: 100%;

            display: block;
        }


        .state {

            text-align: center;

            font-size: 40px;

            font-weight: bold;

            margin: 20px 0;
        }


        .open {

            color: #22c55e;
        }


        .closed {

            color: #ef4444;
        }


        .noface {

            color: #f59e0b;
        }


        .cards {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 15px;
        }


        .card {

            background: #1f2937;

            padding: 20px;

            border-radius: 12px;

            text-align: center;
        }


        .label {

            color: #94a3b8;

            font-size: 14px;

            margin-bottom: 8px;
        }


        .value {

            font-size: 24px;

            font-weight: bold;
        }


        .voice-on {

            color: #ef4444;
        }


        .voice-off {

            color: #22c55e;
        }


        @media (
            max-width: 700px
        ) {

            .cards {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Activity Alert
    </h1>


    <div
        id="server"
        class="server"
    >

        ● Server Connected

    </div>


    <!-- CAMERA -->

    <div class="camera">

        <img
            src="/video"
            alt="Live Camera"
        >

    </div>


    <!-- STATE -->

    <div
        id="state"
        class="state open"
    >

        STARTING

    </div>


    <!-- INFORMATION -->

    <div class="cards">


        <div class="card">

            <div class="label">
                Eye Ratio
            </div>

            <div
                id="ratio"
                class="value"
            >
                0.000
            </div>

        </div>


        <div class="card">

            <div class="label">
                Eyes Closed
            </div>

            <div
                id="closedTime"
                class="value"
            >
                0.0s
            </div>

        </div>


        <div class="card">

            <div class="label">
                Voice 2
            </div>

            <div
                id="voice"
                class="value voice-off"
            >
                OFF
            </div>

        </div>


    </div>


</div>


<script>


async function updateStatus() {

    try {

        const response =
            await fetch(
                "/status",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Server error"
            );

        }


        const data =
            await response.json();


        // ==================================================
        // SERVER
        // ==================================================

        document.getElementById(
            "server"
        ).textContent =
            "● Server Connected";


        // ==================================================
        // STATE
        // ==================================================

        const state =
            document.getElementById(
                "state"
            );


        state.textContent =
            data.state;


        state.className =
            "state";


        if (
            data.state === "OPEN"
        ) {

            state.classList.add(
                "open"
            );

        }

        else if (
            data.state === "CLOSED"
        ) {

            state.classList.add(
                "closed"
            );

        }

        else {

            state.classList.add(
                "noface"
            );

        }


        // ==================================================
        // RATIO
        // ==================================================

        document.getElementById(
            "ratio"
        ).textContent =
            Number(
                data.ratio
            ).toFixed(3);


        // ==================================================
        // CLOSED TIME
        // ==================================================

        document.getElementById(
            "closedTime"
        ).textContent =
            Number(
                data.closed_time
            ).toFixed(1)
            + "s";


        // ==================================================
        // VOICE
        // ==================================================

        const voice =
            document.getElementById(
                "voice"
            );


        if (
            data.voice2_playing
        ) {

            voice.textContent =
                "PLAYING";

            voice.className =
                "value voice-on";

        }

        else {

            voice.textContent =
                "OFF";

            voice.className =
                "value voice-off";

        }

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "server"
        ).textContent =
            "● Server Not Connected";

    }

}


// Update status every 500ms

setInterval(
    updateStatus,
    500
);


// First update

updateStatus();


</script>


</body>

</html>
